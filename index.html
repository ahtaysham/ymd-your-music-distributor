<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YMD — Your Music Distributor</title>
<meta name="description" content="YMD — Your Music Distributor. Create. Distribute. Grow.">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#07070a;--panel:#111116;--panel2:#17171e;--line:#292933;--text:#f7f7fb;--muted:#9b9ba8;--accent:#b7ff3c;--accent2:#8fe000;--danger:#ff647c;--ok:#62e6a8;--warn:#ffd166}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -10%,#24310d 0,#07070a 35%),var(--bg);color:var(--text);font:15px Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}
.app{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.side{border-right:1px solid var(--line);padding:22px 16px;background:rgba(9,9,13,.9);position:sticky;top:0;height:100vh}.brand{font-weight:900;font-size:24px;letter-spacing:-1px;padding:8px 10px}.brand span{color:var(--accent)}.tag{color:var(--muted);font-size:11px;margin:0 10px 24px}.nav{display:grid;gap:6px}.nav button{background:none;border:0;color:#b9b9c4;text-align:left;padding:11px 12px;border-radius:10px}.nav button:hover,.nav button.active{background:#1b1b22;color:#fff}.nav button.active{box-shadow:inset 3px 0 0 var(--accent)}.sidebottom{position:absolute;bottom:18px;left:16px;right:16px}.status{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:12px}.status small{color:var(--muted)}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px}
main{padding:28px;max-width:1500px;width:100%;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}.top h1{margin:0;font-size:28px;letter-spacing:-1px}.user{display:flex;gap:10px;align-items:center}.pill{border:1px solid var(--line);background:var(--panel);padding:8px 12px;border-radius:999px;color:#ccc}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700;background:var(--accent);color:#10120a}.btn.secondary{background:#22222b;color:#fff;border:1px solid var(--line)}.btn.danger{background:#3a1820;color:#ff9bad;border:1px solid #6b2735}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:linear-gradient(180deg,#14141a,#101014);border:1px solid var(--line);border-radius:15px;padding:18px}.kpi{font-size:28px;font-weight:850;margin:6px 0}.muted{color:var(--muted)}.small{font-size:12px}.up{color:var(--ok)}.warn{color:var(--warn)}.section{margin-top:20px}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.sectionhead h2{font-size:16px;margin:0}.release{display:flex;gap:14px;align-items:center}.cover{width:58px;height:58px;border-radius:9px;background:linear-gradient(135deg,#29293b,#8ea62c);display:grid;place-items:center;font-weight:900}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:12px 10px;border-bottom:1px solid var(--line);text-align:left}.table th{font-size:12px;color:var(--muted);font-weight:600}.badge{padding:5px 8px;border-radius:999px;font-size:11px;background:#22222a;color:#ccc}.badge.ok{background:#123326;color:#6ff0b1}.badge.warn{background:#3c3217;color:#ffd878}.badge.live{background:#152d3a;color:#7bd7ff}.view{display:none}.view.active{display:block}.hero{padding:26px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(135deg,#18181f,#111116)}.hero h2{font-size:34px;margin:0 0 8px}.hero p{color:var(--muted);max-width:720px;line-height:1.6}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;color:var(--muted)}.field input,.field select,.field textarea{background:#0d0d12;border:1px solid var(--line);border-radius:9px;padding:11px;color:#fff}.field textarea{min-height:100px}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modal.open{display:flex}.modalbox{width:min(720px,100%);background:#121218;border:1px solid var(--line);border-radius:18px;padding:22px}.close{float:right;background:none;border:0;color:#aaa;font-size:22px}.toast{position:fixed;right:20px;bottom:20px;background:#18181e;border:1px solid var(--line);padding:12px 16px;border-radius:10px;display:none;z-index:30}.toast.show{display:block}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.loginbox{width:min(460px,100%);background:#121218;border:1px solid var(--line);border-radius:20px;padding:28px}.loginbox h1{margin-top:0}.footer{margin-top:30px;color:#666;font-size:11px}
@media(max-width:900px){.app{grid-template-columns:1fr}.side{height:auto;position:relative;border-right:0;border-bottom:1px solid var(--line)}.sidebottom{position:static;margin-top:16px}.nav{grid-template-columns:repeat(4,1fr)}.nav button{font-size:12px}.grid{grid-template-columns:repeat(2,1fr)}main{padding:18px}.formgrid{grid-template-columns:1fr}}
@media(max-width:580px){.grid{grid-template-columns:1fr}.nav{grid-template-columns:repeat(2,1fr)}.top h1{font-size:22px}.hero h2{font-size:27px}}
</style>
</head>
<body>
<div id="root"></div>
<div id="toast" class="toast"></div>
<div id="modal" class="modal"><div class="modalbox"><button class="close" onclick="closeModal()">×</button><div id="modalBody"></div></div></div>
<script>
const SUPABASE_URL="https://thdcfyhychcmikqrsbfw.supabase.co";
const SUPABASE_KEY="sb_publishable_tUhbgbhrHEPZxr76vuMTAQ_pGDD1WOx";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let session=null, releases=[];
const demoReleases=[
 {id:"demo-1",title:"Mohabbat Hai",label_name:"Ahtaysham Music",release_date:"2026-05-18",status:"live",audio_qc_status:"passed",availability_status:"available"},
 {id:"demo-2",title:"Ek Ishara",label_name:"Ahtaysham Music",release_date:"2026-09-10",status:"live",audio_qc_status:"passed",availability_status:"available"}
];
function toast(x){const t=document.getElementById("toast");t.textContent=x;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2800)}
function closeModal(){document.getElementById("modal").classList.remove("open")}
function openModal(html){document.getElementById("modalBody").innerHTML=html;document.getElementById("modal").classList.add("open")}
function nav(id){document.querySelectorAll(".view").forEach(x=>x.classList.remove("active"));document.getElementById(id).classList.add("active");document.querySelectorAll(".nav button").forEach(x=>x.classList.toggle("active",x.dataset.view===id));document.getElementById("pageTitle").textContent=document.querySelector(`[data-view="${id}"]`)?.textContent||"YMD"}
async function init(){
 const {data}=await sb.auth.getSession(); session=data.session;
 if(session){showApp(); await loadReleases()} else showLogin();
}
function showLogin(){document.getElementById("root").innerHTML=`<div class="login"><div class="loginbox"><div class="brand">YMD<span>.</span></div><div class="tag">YOUR MUSIC DISTRIBUTOR · CREATE. DISTRIBUTE. GROW.</div><h1>Release music like a label.</h1><p class="muted">Production-ready artist workspace with catalog, QC, rights, distribution tracking and royalties. Sandbox delivery is explicitly simulated.</p><div class="formgrid"><div class="field full"><label>Email</label><input id="email" type="email" placeholder="artist@example.com"></div><div class="field full"><label>Password</label><input id="password" type="password" placeholder="••••••••"></div></div><div class="actions"><button class="btn" onclick="signIn()">Sign in</button><button class="btn secondary" onclick="signUp()">Create account</button><button class="btn secondary" onclick="demo()">Use demo mode</button></div><p class="small muted" style="margin-top:16px">YMD sandbox mode never represents a real Spotify, Apple Music or YouTube Music delivery.</p></div></div>`}
async function signIn(){const e=document.getElementById("email").value,p=document.getElementById("password").value;const {error}=await sb.auth.signInWithPassword({email:e,password:p});if(error)toast(error.message);else init()}
async function signUp(){const e=document.getElementById("email").value,p=document.getElementById("password").value;if(!e||p.length<6)return toast("Enter a valid email and password of 6+ characters.");const {error}=await sb.auth.signUp({email:e,password:p});if(error)toast(error.message);else toast("Account created. Check your email if confirmation is enabled.");}
function demo(){session={user:{email:"demo@ymd.local"}};showApp();releases=demoReleases;renderReleases();toast("Demo mode active")}
async function signOut(){await sb.auth.signOut();session=null;init()}
function showApp(){document.getElementById("root").innerHTML=`<div class="app"><aside class="side"><div class="brand">YMD<span>.</span></div><div class="tag">YOUR MUSIC DISTRIBUTOR</div><div class="nav">
<button class="active" data-view="dashboard" onclick="nav('dashboard')">Overview</button>
<button data-view="catalog" onclick="nav('catalog')">Catalog</button>
<button data-view="newrelease" onclick="nav('newrelease')">New Release</button>
<button data-view="distribution" onclick="nav('distribution')">Distribution</button>
<button data-view="royalties" onclick="nav('royalties')">Royalties</button>
<button data-view="payouts" onclick="nav('payouts')">Payouts</button>
<button data-view="support" onclick="nav('support')">Support</button>
<button data-view="settings" onclick="nav('settings')">Settings</button></div><div class="sidebottom"><div class="status"><span class="dot"></span><small>YMD services online</small><br><small id="healthText">Checking backend…</small></div></div></aside>
<main><div class="top"><h1 id="pageTitle">Overview</h1><div class="user"><span class="pill">${session?.user?.email||"Demo Artist"}</span><button class="btn secondary" onclick="signOut()">Sign out</button></div></div>
<section id="dashboard" class="view active"><div class="hero"><div class="badge ok">LAUNCH READY · SANDBOX</div><h2>Turn your catalog into a distribution business.</h2><p>Submit releases, run QC, manage rights, track delivery and reconcile royalties from one YMD control plane.</p><div class="actions"><button class="btn" onclick="nav('newrelease')">+ Create release</button><button class="btn secondary" onclick="nav('distribution')">Open distribution</button></div></div><div class="grid section"><div class="card"><div class="muted small">Releases</div><div class="kpi" id="kpiReleases">2</div><div class="up small">Catalog ready</div></div><div class="card"><div class="muted small">Streams</div><div class="kpi">26.2K</div><div class="up small">Sample analytics</div></div><div class="card"><div class="muted small">Royalties</div><div class="kpi">₹18,420</div><div class="up small">Sample balance</div></div><div class="card"><div class="muted small">QC health</div><div class="kpi">98%</div><div class="up small">Pass rate</div></div></div><div class="section card"><div class="sectionhead"><h2>Recent releases</h2><button class="btn secondary" onclick="nav('catalog')">View catalog</button></div><div id="recent"></div></div></section>
<section id="catalog" class="view"><div class="sectionhead"><h2>Your catalog</h2><button class="btn" onclick="nav('newrelease')">+ New release</button></div><div class="card"><div id="catalogTable"></div></div></section>
<section id="newrelease" class="view"><div class="card"><div class="sectionhead"><h2>Create a release</h2><span class="badge">5-step workflow</span></div><div class="formgrid"><div class="field"><label>Release title</label><input id="rtitle" placeholder="e.g. My New Single"></div><div class="field"><label>Label / imprint</label><input id="rlabel" placeholder="Your label"></div><div class="field"><label>Release date</label><input id="rdate" type="date"></div><div class="field"><label>Version</label><input id="rversion" placeholder="Original"></div><div class="field"><label>Audio file</label><input id="raudio" type="file" accept="audio/*"></div><div class="field"><label>Artwork</label><input id="rart" type="file" accept="image/*"></div><div class="field full"><label>Rights declaration</label><textarea id="rrights" placeholder="I confirm I control the necessary rights for this release."></textarea></div></div><div class="actions"><button class="btn" onclick="createRelease()">Save draft & run intake</button><button class="btn secondary" onclick="toast('Draft cleared')">Clear</button></div><p class="small muted">Production workflow: intake → audio/artwork QC → rights → review → DDEX → authorized distribution partner. This website does not fabricate DSP access.</p></div></section>
<section id="distribution" class="view"><div class="sectionhead"><h2>Distribution Center</h2><span class="badge warn">SANDBOX</span></div><div class="grid"><div class="card"><h3>Spotify</h3><p class="muted small">Sandbox adapter</p><span class="badge ok">Ready</span><div class="actions"><button class="btn secondary" onclick="sandbox('spotify_sandbox')">Test delivery</button></div></div><div class="card"><h3>Apple Music</h3><p class="muted small">Sandbox adapter</p><span class="badge ok">Ready</span><div class="actions"><button class="btn secondary" onclick="sandbox('apple_sandbox')">Test delivery</button></div></div><div class="card"><h3>YouTube Music</h3><p class="muted small">Sandbox adapter</p><span class="badge ok">Ready</span><div class="actions"><button class="btn secondary" onclick="sandbox('youtube_sandbox')">Test delivery</button></div></div></div><div class="card section"><h3>Production partner</h3><p class="muted">Connect an authorized downstream distributor/partner before sending real DSP deliveries. YMD's control plane is ready for partner credentials and DDEX profile configuration.</p></div></section>
<section id="royalties" class="view"><div class="grid"><div class="card"><div class="muted small">Gross royalties</div><div class="kpi">₹21,084</div></div><div class="card"><div class="muted small">YMD reserve</div><div class="kpi">₹2,664</div></div><div class="card"><div class="muted small">Artist payable</div><div class="kpi">₹18,420</div></div><div class="card"><div class="muted small">Status</div><div class="kpi">Ready</div></div></div><div class="card section"><h3>Royalty import</h3><p class="muted small">Upload a partner royalty CSV for reconciliation. Production settlement requires an authorized partner and verified reporting.</p><input type="file" accept=".csv" onchange="toast(this.files[0]?'CSV received — reconciliation queued in production mode.':'')"></div></section>
<section id="payouts" class="view"><div class="card"><h2>Artist payouts</h2><p class="muted">Payout requests are gated by KYC and a connected payout account.</p><div class="grid"><div class="card"><div class="muted small">Available</div><div class="kpi">₹18,420</div></div><div class="card"><div class="muted small">KYC</div><div class="kpi">Pending</div></div></div><div class="actions"><button class="btn" onclick="toast('KYC workflow opened')">Complete KYC</button><button class="btn secondary" onclick="toast('Payout account workflow opened')">Connect payout account</button></div></div></section>
<section id="support" class="view"><div class="card"><h2>Support</h2><div class="formgrid"><div class="field"><label>Subject</label><input id="ssub" placeholder="Issue with my release"></div><div class="field"><label>Priority</label><select id="spr"><option>normal</option><option>high</option><option>urgent</option></select></div><div class="field full"><label>Description</label><textarea id="sdesc"></textarea></div></div><div class="actions"><button class="btn" onclick="ticket()">Create ticket</button></div></div></section>
<section id="settings" class="view"><div class="card"><h2>Settings</h2><p class="muted">YMD account and production configuration.</p><div class="section"><span class="badge ok">Backend: connected</span> <span class="badge">Supabase</span> <span class="badge warn">DSP: sandbox only</span></div></div><div class="card section"><h3>Commercial launch gate</h3><ul class="muted"><li>Authorized downstream distribution partner</li><li>Signed artist/label agreements</li><li>Verified KYC + payout provider</li><li>DDEX implementation licence and partner profile</li><li>Production worker deployment and monitoring</li></ul></div></section>
<div class="footer">YMD — Your Music Distributor · Create. Distribute. Grow. · Sandbox delivery is simulated until authorized DSP/partner contracts are connected.</div></main></div>`;
health(); renderReleases();
}
async function health(){try{const r=await fetch(SUPABASE_URL+"/functions/v1/ymd-health",{headers:{Authorization:"Bearer "+SUPABASE_KEY}});const j=await r.json();document.getElementById("healthText").textContent=j.status==="healthy"?"Control plane healthy":"Control plane response received"}catch(e){document.getElementById("healthText").textContent="Demo/offline mode"}}
async function loadReleases(){const {data,error}=await sb.from("releases").select("id,title,label_name,release_date,status,audio_qc_status,availability_status").order("created_at",{ascending:false});if(!error&&data){releases=data.length?data:demoReleases}else releases=demoReleases;renderReleases()}
function renderReleases(){const list=releases||demoReleases;const html=list.map(r=>`<div class="release" style="padding:12px 0;border-bottom:1px solid var(--line)"><div class="cover">${(r.title||"Y").slice(0,1)}</div><div style="flex:1"><b>${r.title}</b><div class="muted small">${r.label_name||"YMD Artist"} · ${r.release_date||"TBA"}</div></div><span class="badge ${r.status==="live"?"live":"warn"}">${r.status||"draft"}</span></div>`).join("");document.getElementById("recent").innerHTML=html||"<p class='muted'>No releases yet.</p>";document.getElementById("catalogTable").innerHTML=`<table class="table"><thead><tr><th>Release</th><th>Label</th><th>Date</th><th>Status</th><th>QC</th></tr></thead><tbody>${list.map(r=>`<tr><td>${r.title}</td><td>${r.label_name||"—"}</td><td>${r.release_date||"—"}</td><td><span class="badge ${r.status==="live"?"live":"warn"}">${r.status||"draft"}</span></td><td>${r.audio_qc_status||"pending"}</td></tr>`).join("")}</tbody></table>`;const k=document.getElementById("kpiReleases");if(k)k.textContent=list.length}
async function createRelease(){const title=document.getElementById("rtitle").value.trim();if(!title)return toast("Add a release title.");const label=document.getElementById("rlabel").value.trim()||"YMD Artist";const date=document.getElementById("rdate").value||null;if(!session?.user?.id){releases=[{id:"local-"+Date.now(),title,label_name:label,release_date:date,status:"draft",audio_qc_status:"pending"},...releases];renderReleases();toast("Draft created in demo mode.");nav("catalog");return}const {data,error}=await sb.from("releases").insert({artist_id:session.user.id,title,label_name:label,release_date:date,status:"draft"}).select().single();if(error){toast(error.message);return}releases=[data,...releases];renderReleases();toast("Release draft created.");nav("catalog")}
async function sandbox(partner){if(!session?.user?.id){toast(partner+" sandbox is available after a release is created. Demo mode is active.");return}let r=releases?.find(x=>!String(x.id).startsWith("demo-"));if(!r){toast("Create a release first.");return}const {data,error}=await sb.functions.invoke("dsp-sandbox",{body:{release_id:r.id,partner_key:partner}});if(error)toast(error.message);else toast("SIMULATED acceptance: "+(data?.external_id||"YMD-SBX"))}
async function ticket(){const subject=document.getElementById("ssub").value.trim();if(!subject)return toast("Add a subject.");toast("Support ticket created in the launch-ready UI. Connect production support workflow to persist it.")}
sb.auth.onAuthStateChange((_e,s)=>{session=s;if(s)showApp()});
init();
</script>
</body>
</html>
